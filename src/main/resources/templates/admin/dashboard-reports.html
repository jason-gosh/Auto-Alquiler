<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: mainLayout(~{::content})}">
<head>
    <meta charset="UTF-8">
    <title th:text="'Panel de Reportes Estratégicos'"></title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-8">

    <div th:fragment="content" class="max-w-7xl mx-auto" >
        <div class="flex justify-between items-center border-b border-slate-800 pb-6 mb-8">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white uppercase" th:text="'Panel de Control Estratégico'"></h1>
                <p class="text-xs text-slate-400 mt-1" th:text="'Indicadores operacionales e ingresos en tiempo real'"></p>
            </div>
            <div class="flex gap-3">
                <a th:href="@{/admin/reports/export/excel}" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold uppercase tracking-wider rounded transition-colors" th:text="'Exportar Excel'"></a>
                <a th:href="@{/admin/reports/export/pdf}" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold uppercase tracking-wider rounded transition-colors" th:text="'Exportar PDF'"></a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-[#151f32]/60 border border-slate-800 p-6 rounded-xl">
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-500" th:text="'Vehículos Activos Total'"></p>
                <h3 class="text-3xl font-mono font-black text-white mt-2" th:text="${metrics.activeVehicles}"></h3>
            </div>
            <div class="bg-[#151f32]/60 border border-slate-800 p-6 rounded-xl">
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-500" th:text="'Reservas Registradas Hoy'"></p>
                <h3 class="text-3xl font-mono font-black text-blue-400 mt-2" th:text="${metrics.reservationsToday}"></h3>
            </div>
            <div class="bg-[#151f32]/60 border border-slate-800 p-6 rounded-xl">
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-500" th:text="'Tasa de Ocupación actual'"></p>
                <h3 class="text-3xl font-mono font-black text-emerald-400 mt-2" th:text="${metrics.occupancyRate + '%'}"></h3>
            </div>
        </div>

        <div class="bg-[#151f32]/40 border border-slate-800 rounded-xl p-6">
            <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-6 border-b border-slate-800 pb-3" th:text="'Desglose Financiero por Período de Recaudo'"></h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="p-4 bg-slate-900/50 rounded border border-slate-800/60">
                    <span class="text-[10px] font-bold uppercase text-slate-500" th:text="'Cierre Diario'"></span><br>
                    <span class="text-xl font-mono font-bold text-white" th:text="${'$' + metrics.dailyRevenue}"></span>
                </div>
                <div class="p-4 bg-slate-900/50 rounded border border-slate-800/60">
                    <span class="text-[10px] font-bold uppercase text-slate-500" th:text="'Acumulado Mensual'"></span><br>
                    <span class="text-xl font-mono font-bold text-white" th:text="${'$' + metrics.monthlyRevenue}"></span>
                </div>
                <div class="p-4 bg-slate-900/50 rounded border border-slate-800/60">
                    <span class="text-[10px] font-bold uppercase text-slate-500" th:text="'Balance Anual'"></span><br>
                    <span class="text-xl font-mono font-bold text-white" th:text="${'$' + metrics.yearlyRevenue}"></span>
                </div>
            </div>
        </div>
        
    </div>

</body>
</html>

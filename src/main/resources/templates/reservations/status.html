<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::section})}">
<section class="flex items-center justify-center min-h-[70vh]">
    <div class="w-full max-w-2xl bg-[#1e293b] border border-slate-800 p-12 rounded-3xl shadow-2xl text-center">
        
        <div th:if="${successMessage}" class="space-y-6">
            <div class="w-20 h-20 bg-emerald-500/20 border-2 border-emerald-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="text-emerald-500 text-3xl">✓</span>
            </div>
            <h2 class="text-3xl font-black text-white uppercase italic" th:text="${successMessage}">Reserva Exitosa</h2>
            <p class="text-slate-400 text-sm">Tu contrato ha sido generado y los datos del vehículo están bloqueados para las fechas seleccionadas.</p>
            <a th:href="@{/vehicles}" class="inline-block mt-8 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-xl uppercase text-xs">Volver al inicio</a>
        </div>

        <div th:if="${errorType == 'OVERLAP'}" class="space-y-6">
            <div class="w-20 h-20 bg-red-500/20 border-2 border-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="text-red-500 text-3xl">!</span>
            </div>
            <h2 class="text-3xl font-black text-white uppercase italic">Vehículo no disponible</h2>
            <p class="text-slate-400 text-sm">Lo sentimos, este auto ya tiene una reserva confirmada en el rango de fechas que elegiste.</p>
            <button onclick="history.back()" class="inline-block mt-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl uppercase text-xs">Intentar otras fechas</button>
        </div>

    </div>
</section>
</html>

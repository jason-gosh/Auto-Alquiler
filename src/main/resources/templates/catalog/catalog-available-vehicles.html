<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: mainLayout(~{::section})}">
<body>
    <section class="max-w-7xl mx-auto mt-10 p-4">
        
        <div class="mb-8">
            <h1 class="text-3xl font-black text-white italic tracking-tighter"
                th:text="${reservationId != null} ? 'CAMBIAR VEHÍCULO DE LA RESERVA' : 'FLOTA DISPONIBLE'">
                FLOTA DISPONIBLE
            </h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1"
               th:text="${reservationId != null} ? 'Selecciona un nuevo vehículo para cubrir el rango de fechas contratado' : 'Encuentra y reserva tu vehículo ideal'">
                Encuentra y reserva tu vehículo ideal
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-[#1e293b] border border-slate-800 p-6 rounded-3xl sticky top-6">
                    <div class="flex justify-between items-center mb-6 gap-2">
                        <h3 class="text-white text-[10px] font-black uppercase tracking-widest m-0"
                            th:text="${reservationId != null} ? 'Reserva en Modificación: #' + ${reservationId} : 'Filtros de Búsqueda'">
                            Filtros de Búsqueda
                        </h3>
                        
                        <a th:href="@{/catalog/reservedVehicles}" 
                           class="bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white border border-emerald-500/30 text-[8px] font-black uppercase tracking-widest px-3 py-1.5 rounded-lg transition-all shadow-lg shadow-emerald-500/10 whitespace-nowrap">
                            Mis Reservas
                        </a>
                    </div>
                    <form th:action="@{/catalog}" method="get" class="space-y-4">
                        <input type="hidden" name="reservationId" th:if="${reservationId != null}" th:value="${reservationId}">

                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest block mb-1">Recogida</label>
                            <input type="date" id="startDate" name="startDate" th:value="${param.startDate}" 
                                   th:disabled="${reservationId != null}"
                                   th:min="${todayDate}"
                                   th:classappend="${reservationId != null} ? 'opacity-50 cursor-not-allowed bg-[#0f172a]/50' : ''"
                                   class="w-full bg-[#0f172a] border border-slate-800 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-blue-500 transition-all" required>
                            <input type="hidden" name="startDate" th:if="${reservationId != null}" th:value="${param.startDate}" >
                        </div>
                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest block mb-1">Devolución</label>
                            <input type="date" id="endDate" name="endDate" th:value="${param.endDate}" 
                                   th:disabled="${reservationId != null}"
                                   th:min="${todayDate}"
                                   th:classappend="${reservationId != null} ? 'opacity-50 cursor-not-allowed bg-[#0f172a]/50' : ''"
                                   class="w-full bg-[#0f172a] border border-slate-800 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-blue-500 transition-all" required>
                            <input type="hidden" name="endDate" th:if="${reservationId != null}" th:value="${param.endDate}">
                        </div>

                        <hr class="border-slate-800 my-4">

                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest block mb-1">Tipo de Vehículo</label>
                            <select name="type" class="w-full bg-[#0f172a] border border-slate-800 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-blue-500 transition-all">
                                <option value="">Todos los tipos</option>
                                <option value="Bicicleta" th:selected="${param.type == 'Bicicleta'}" class="bg-[#1e293b]">Bicicleta</option>
                                <option value="Motocicleta" th:selected="${param.type == 'Motocicleta'}" class="bg-[#1e293b]">Motocicleta</option>
                                <option value="Carro" th:selected="${param.type == 'Carro'}"  class="bg-[#1e293b]">Carro</option>
                                <option value="Camioneta" th:selected="${param.type == 'Camioneta'}"  class="bg-[#1e293b]">Camioneta</option>
                                <option value="Camion" th:selected="${param.type == 'Camion'}"  class="bg-[#1e293b]">Camion</option>
                                <option value="Mula" th:selected="${param.type == 'Mula'}"  class="bg-[#1e293b]">Mula</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest block mb-1">Localización</label>
                            <select name="locationId" class="w-full bg-[#0f172a] border border-slate-800 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-blue-500 transition-all">
                                <option value="">Cualquier Localización</option>
                                <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.department + ' - ' + loc.municipality}" th:selected="${param.locationId != null and param.locationId.toString() == loc.id.toString()}"></option>
                            </select>
                        </div>

                        <div>
                            <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest block mb-1">Presupuesto Máx / Día</label>
                            <input type="text" id="maxPrice" name="maxPrice" th:value="${param.maxPrice}" min="0" max="99999999999" placeholder="Ej: 200000" class="w-full bg-[#0f172a] border border-slate-800 rounded-xl px-3 py-2 text-white text-xs outline-none focus:border-blue-500 transition-all">
                        </div>

                        <button type="submit" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-black uppercase text-[10px] py-3 rounded-xl transition-all tracking-widest shadow-lg shadow-blue-500/10">
                            Aplicar Filtros
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-3">
                
                <div th:if="${error}" class="bg-red-500/10 border border-red-500 text-red-500 p-4 rounded-xl mb-6 text-[10px] font-bold text-center uppercase tracking-widest" th:text="${error}"></div>

                <div th:if="${#lists.isEmpty(vehicles)}" class="bg-[#1e293b] border border-slate-800 p-10 rounded-3xl text-center">
                    <p class="text-slate-500 font-bold text-xs uppercase tracking-widest">No hay vehículos disponibles para los filtros seleccionados.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div th:each="v : ${vehicles}" class="bg-[#1e293b] border border-slate-800 rounded-3xl overflow-hidden hover:border-slate-600 transition-all group flex flex-col">
                        
                        <div class="aspect-[4/3] bg-slate-800 relative overflow-hidden">
                            <img th:if="${not #lists.isEmpty(v.images)}" th:src="${v.images[0].imagePath}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <div th:if="${#lists.isEmpty(v.images)}" class="w-full h-full flex items-center justify-center text-slate-600 text-[10px] font-black uppercase tracking-widest">Sin Foto</div>
                            <span class="absolute top-3 left-3 bg-blue-600/90 text-white text-[8px] font-black uppercase px-3 py-1 rounded-full backdrop-blur-sm" th:text="${v.type}"></span>
                        </div>

                        <div class="p-5 flex flex-col flex-grow">
                            <h4 class="text-xl font-black text-white italic tracking-tight" th:text="${v.brand + ' ' + v.model}"></h4>
                            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1 mb-4 flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                <span th:text="${v.location.municipality}"></span>
                            </p>
                            
                            <div class="mt-auto pt-4 border-t border-slate-800 flex justify-between items-end">
                                <div>
                                    <p class="text-slate-500 text-[8px] font-black uppercase tracking-widest">Tarifa Diaria</p>
                                    <p class="text-green-500 font-black text-lg" th:text="${'$ ' + #numbers.formatInteger(v.dailyRate, 1, 'POINT')}"></p>
                                </div>
                                
                                <a th:if="${reservationId != null}"
                                   th:href="@{/reservations/initProcess/{id}(id=${v.id}, startDate=${param.startDate}, endDate=${param.endDate}, reservationId=${param.reservationId})}"
                                   class="bg-emerald-600 hover:bg-emerald-500 text-white font-black uppercase text-[9px] px-4 py-2 rounded-lg transition-colors tracking-widest">
                                    Asignar a Reserva
                                </a>
                            
                                <a th:unless="${reservationId != null}"
                                   th:href="@{/vehicles/details/{id}(id=${v.id}, source='catalog', startDate=${param.startDate}, endDate=${param.endDate})}"
                                   class="bg-white text-slate-900 hover:bg-slate-200 font-black uppercase text-[9px] px-4 py-2 rounded-lg transition-colors tracking-widest">
                                    Ver y Reservar
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
              const isEditing = /*[[${reservationId != null}]]*/ false;    
              if(!isEditing) {
                const startDateInput = document.getElementById('startDate');
                const endDateInput = document.getElementById('endDate');

                startDateInput.addEventListener('change', function() {
                  if (startDateInput.value) {
                    endDateInput.min = startDateInput.value;
                    if (endDateInput.value && endDateInput.value < startDateInput.value) {
                      endDateInput.value = startDateInput.value;
                    }
                  } else {
                    endDateInput.min = /*[[${todayDate}]]*/ '';
                  }
                });
              }

                const maxPriceInput = document.getElementById('maxPrice');
                maxPriceInput.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    if (this.value !== '' && BigInt(this.value) > 99999999999n) {
                        this.value = '99999999999';
                    }
                });
            });
        </script>
    </section>
</body>
</html>

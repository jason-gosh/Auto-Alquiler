<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: mainLayout(~{::section})}">
<body>
    <section>
        <div class="max-w-md mx-auto bg-[#1e293b] border border-slate-800 p-10 rounded-3xl shadow-2xl mt-10">
            <h2 class="text-xl font-black text-center mb-8 uppercase italic text-white tracking-tight">Acceso Cliente</h2>
            
            <div th:if="${param.error}" class="bg-red-500/10 border border-red-500 text-red-500 p-3 rounded-xl mb-6 text-[10px] font-bold text-center uppercase">
                Usuario o contraseña incorrectos
            </div>

            <form th:action="@{/auth/login}" method="post" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Usuario</label>
                    <input type="text" name="username" class="w-full bg-[#0f172a] border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-blue-500" required />
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Contraseña</label>
                    <input type="password" name="password" class="w-full bg-[#0f172a] border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-blue-500" required />
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black uppercase text-xs tracking-widest transition-all">
                    Iniciar Sesión
                </button>
            </form>
            
            <div class="mt-8 text-center border-t border-slate-800 pt-6">
                <a th:href="@{/auth/register}" class="text-slate-500 text-[10px] font-bold uppercase hover:text-white transition-colors">¿No tienes cuenta? Regístrate aquí</a>
            </div>
        </div>
    </section>
</body>
</html>
